<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SUKH IMPLEMENT-Sales</title>
<style>
:root{--bg:#f4f6f4;--surf:#fff;--ink:#1e2a2f;--mute:#5d6b70;--line:#dfe5e1;--g:#1f4d2e;--g2:#e6f0e8;--o:#f6510d;--warn:#9a5b00;--warnbg:#fdf1dc;--bad:#a12626;--badbg:#fbe5e5;--ok:#1f6b3a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121816;--surf:#1a2320;--ink:#e6ece8;--mute:#9aa9a2;--line:#2c3935;--g:#6fbf86;--g2:#233a2b;--warn:#f0c27a;--warnbg:#3a2e16;--bad:#f09a9a;--badbg:#3d1f1f;--ok:#7fd49a}}
:root[data-theme="dark"]{--bg:#121816;--surf:#1a2320;--ink:#e6ece8;--mute:#9aa9a2;--line:#2c3935;--g:#6fbf86;--g2:#233a2b;--warn:#f0c27a;--warnbg:#3a2e16;--bad:#f09a9a;--badbg:#3d1f1f;--ok:#7fd49a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--g);outline-offset:2px}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
nav.side{background:var(--surf);border-right:1px solid var(--line);padding:16px 10px;position:sticky;top:0;height:100vh}
.brand{font-weight:700;font-size:15px;padding:4px 10px 16px;color:var(--g)}
.nb{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:6px;cursor:pointer;color:var(--mute)}
.nb:hover{background:var(--bg)}.nb[aria-current=page]{background:var(--g2);color:var(--g);font-weight:600}
.top{display:flex;gap:10px;align-items:center;padding:10px 24px;background:var(--surf);border-bottom:1px solid var(--line);flex-wrap:wrap}
.top input{flex:1;min-width:140px;max-width:380px;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.btn{background:var(--o);color:#fff;border:0;border-radius:6px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn.sec{background:var(--surf);color:var(--ink);border:1px solid var(--line);font-weight:500}
.notice{background:var(--warnbg);color:var(--warn);padding:6px 24px;font-size:12.5px}
main{padding:20px 24px;max-width:1200px;min-width:0}
h1{font-size:20px;margin:0 0 4px}h2{font-size:15px;margin:0 0 10px}
.sub{color:var(--mute);margin:0 0 16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.kpi b{display:block;font-size:20px;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi small{color:var(--mute)}.kpi.hl{border-left:3px solid var(--g)}
.k3{grid-template-columns:repeat(3,1fr)}@media(max-width:640px){.k3{grid-template-columns:1fr}}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:12px;margin-bottom:16px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mute);font-weight:600;font-size:12.5px}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.row{cursor:pointer}tr.row:hover{background:var(--bg)}
.badge{padding:2px 8px;border-radius:99px;font-size:12px;background:var(--g2);color:var(--g);font-weight:600}
.badge.warn{background:var(--warnbg);color:var(--warn)}.badge.bad{background:var(--badbg);color:var(--bad)}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.steps button{border:1px solid var(--line);background:var(--surf);border-radius:99px;padding:5px 12px;cursor:pointer;color:var(--mute)}
.steps button[aria-current=step]{background:var(--o);color:#fff;border-color:var(--o)}
.form{display:grid;grid-template-columns:1fr 300px;gap:16px;align-items:start}
fieldset{border:0;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label{display:flex;flex-direction:column;gap:3px;font-weight:600;font-size:12.5px}
label input,label select,label textarea{padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surf);font-weight:400;font-size:14px}
.err{color:var(--bad);font-weight:400;min-height:1em}
.sum div{display:flex;justify-content:space-between;padding:5px 0;font-variant-numeric:tabular-nums}
.sum .t{border-top:1px solid var(--line);margin-top:4px;padding-top:8px;font-weight:700}
.acts{display:flex;justify-content:space-between;margin-top:16px}
.bars{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:8px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--mute)}
.bars i{display:block;width:100%;background:var(--g);border-radius:3px 3px 0 0;min-height:2px}
.toast{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--g);color:var(--surf);padding:10px 16px;border-radius:8px;display:none}
.menu{display:none}
@media(max-width:860px){.app{grid-template-columns:minmax(0,1fr)}nav.side{position:fixed;z-index:5;width:220px;transform:translateX(-100%);transition:transform .15s}nav.side.open{transform:none}.menu{display:inline-block}.grid2,.form{grid-template-columns:1fr}main,.top,.notice{padding-left:14px;padding-right:14px}}
#pa{display:none}
@media print{html,body{background:#fff!important}.app,.toast{display:none!important}#pa{display:block!important;color:#000;background:#fff;font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:8px 4px}#pa h1{font-size:20px;margin:0}#pa table{width:100%;border-collapse:collapse;margin:6px 0 14px}#pa td,#pa th{border-bottom:1px solid #ccc;padding:6px 8px;text-align:left;font-size:13px}#pa .n{text-align:right}#pa .big{border:2px solid #000;border-radius:8px;padding:14px 18px;margin:12px 0;display:flex;justify-content:space-between;align-items:center;font-size:20px;font-weight:700}#pa .sig{display:flex;justify-content:space-between;margin-top:48px;font-size:12px}#pa .sig div{border-top:1px solid #000;padding-top:4px;width:40%}#pa small{color:#444}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
tr.alarm td{background:var(--badbg);color:var(--bad);font-weight:600}.item{background:var(--bg)}

.btn.sm{padding:4px 9px;font-size:13px}
.tb{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:0 0 12px}
.tb input[type=search],.tb input:not([type]){flex:1 1 220px;min-width:160px;width:auto}
.tb select,.tb input[type=month],.tb input[type=date]{width:auto}
input[type=checkbox],input[type=radio]{width:auto;flex:none}
[hidden]{display:none!important}
#lg{position:fixed;top:0;left:0;right:0;bottom:0;z-index:50;background:#1b2a2a;overflow:hidden;--p:1px}

<script>
const NAV=["Dashboard","New Product Deals","Trade-in Stock","Payment Ledger","Finance Receivables","Customers","Reports","Settings"];
const inr=n=>"₹"+new Intl.NumberFormat("en-IN",{maximumFractionDigits:0}).format(n||0);
const fd=d=>d?new Date(d+"T00:00:00").toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric",timeZone:"Asia/Kolkata"}):"–";
const num=v=>Math.max(0,parseFloat(String(v==null?"":v).replace(/,/g,""))||0);
const PENDM=m=>m==="Cheque"||m==="Commitment";
const mN=p=>p.method==="Commitment"?"Commitment":"Cheque";
const mDone=p=>p.method==="Commitment"?"received":"cleared";
/* Central calculation (single source for every view) */
function calc(d){
 const net=Math.max(0,d.invoice-d.discount+d.other+(d.rc||0)+(d.ins||0)-d.tradeIn);
 const receipts=d.payments.filter(p=>p.cleared).reduce((s,p)=>s+p.amount,0);
 const out=d.status==="Cancelled"?0:Math.max(0,net-receipts);

 main.innerHTML=`<h1>Settings · Products</h1><p class="sub">The products offered when you enter a deal. Changes apply at once and are saved automatically. Deals already made keep what they have.</p>

   if(!n){er.textContent="Enter the product name.";return}
   const nm=(b?b+" ":"")+n;if(MODELS.some((x,j)=>j!==i&&modelName(x).toLowerCase()===nm.toLowerCase())){er.textContent="This product already exists.";return}
   if(i!=null){const old=modelName(MODELS[i]),c=prodUsed(old);if(c>0&&old.toLowerCase()!==nm.toLowerCase()){er.textContent="This product is used in "+c+" deal(s), so its name cannot be changed. Hide it and add a new product instead.";return}}

 const many=()=>{$("#pform").innerHTML=`<div class="card" style="margin-bottom:12px;max-width:620px"><h2>Add many products at once</h2><p class="sub">One product per line. Use <b>Name</b>, or <b>Name | Type</b>, or <b>Brand | Name | Type</b>. Products that already exist are skipped.</p><div style="display:grid;gap:8px">

    const nm=(b?b+" ":"")+n;if(MODELS.some(x=>modelName(x).toLowerCase()===nm.toLowerCase())){skip++;return}MODELS.push([b,n,k==="tractor"?t:(t||"Other"),u,k,0]);add++});

/* ===== Indian comma format in amount boxes ===== */
const isAmt=el=>!!el&&el.tagName==="INPUT"&&!el.readOnly&&(el.getAttribute("inputmode")==="numeric"||(el.dataset&&el.dataset.f==="rate"));
const fmtIN=s=>{s=String(s).replace(/[^\d.]/g,"");const p=s.split(".");let i=p[0].replace(/^0+(?=\d)/,"");const r=i.length>3?i.slice(0,-3).replace(/\B(?=(\d{2})+(?!\d))/g,",")+","+i.slice(-3):i;return p.length>1?r+"."+p.slice(1).join("").slice(0,2):r};
document.addEventListener("input",e=>{const el=e.target;if(!isAmt(el))return;const pos=el.selectionStart==null?el.value.length:el.selectionStart,before=el.value.slice(0,pos).replace(/[^\d.]/g,"").length;
 const v=fmtIN(el.value);if(v===el.value)return;el.value=v;let n=0,k=0;while(k<v.length&&n<before){if(/[\d.]/.test(v[k]))n++;k++}try{el.setSelectionRange(k,k)}catch{}},true);
new MutationObserver(()=>{document.querySelectorAll("#main input").forEach(el=>{if(isAmt(el)&&/^\d{4,}$/.test(el.value))el.value=fmtIN(el.value)})}).observe($("#main"),{childList:true,subtree:true});
